<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Portfolio Admin</title>
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
    <main class="admin-shell">
        <header><a href="/">← Portfolio</a><p>PRIVATE CONTENT ADMIN</p><h1>Project archive</h1></header>
        <section class="admin-card token-card">
            <label>Admin token <input id="token" type="password" autocomplete="off" placeholder="Enter the Cloudflare secret"></label>
            <button id="load-projects" type="button">Unlock projects</button>
            <p id="status" aria-live="polite"></p>
        </section>
        <section class="admin-card">
            <h2>Create project</h2>
            <form id="project-form">
                <label>Slug <input name="slug" required pattern="[a-z0-9-]+" placeholder="coffee-campaign"></label>
                <label>Order <input name="index" required value="01" maxlength="4"></label>
                <label>Title <input name="name" required></label>
                <label>Full title <input name="fullName"></label>
                <label>Client <input name="client" value="PERSONAL PROJECT"></label>
                <label>Year <input name="year" required placeholder="2026"></label>
                <label>Type <input name="type" required placeholder="BRAND / DESIGN"></label>
                <label>Category <input name="category" value="Personal"></label>
                <label>Status <input name="status" value="ARCHIVE"></label>
                <label>Kind <select name="kind"><option value="personal">Personal</option><option value="client">Client</option></select></label>
                <label class="wide">Description <textarea name="description" rows="4"></textarea></label>
                <label class="checkbox wide"><input name="published" type="checkbox"> Publish immediately</label>
                <button type="submit">Create project</button>
            </form>
        </section>
        <section class="admin-card">
            <h2>Upload images</h2>
            <form id="upload-form">
                <label>Project <select name="project" id="project-select" required></select></label>
                <label>Category <select name="category"><option value="social-post">Social media post</option><option value="story">Story</option><option value="square">Square</option><option value="landscape">Landscape</option><option value="other" selected>Other</option></select></label>
                <label>Image <input name="file" type="file" accept="image/*" required></label>
                <label>Alt text <input name="alt" placeholder="Optional image description"></label>
                <button type="submit">Upload image</button>
            </form>
            <p>Upload optimized WebP files where possible. Maximum file size: 10 MB.</p>
        </section>
        <section class="admin-card"><h2>All projects</h2><div id="project-list"></div></section>
    </main>
    <script src="/admin/admin.js"></script>
</body>
</html>
