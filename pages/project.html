<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Project gallery.">
    <title>Project | Lyan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/project-gallery.css">
</head>

<body>

    <div id="navigation"></div>

    <main class="project-page" id="project-page">

        <section
            class="project-gallery"
            id="gallery"
            aria-label="Project gallery"
        >

            <aside
                class="gallery-sidebar"
                id="gallery-sidebar"
                aria-label="Project navigation"
            >

                <div class="gallery-sidebar-inner">

                    <div class="gallery-sidebar-top">
                        <span class="gallery-sidebar-label">
                            PROJECT
                        </span>

                        <span class="gallery-sidebar-index">
                            SYS / 01
                        </span>
                    </div>

                    <nav
                        class="gallery-sidebar-nav"
                        aria-label="Project navigation"
                    >

                        <a
                            href="../index.html#hero"
                            class="gallery-sidebar-link"
                        >
                            <span class="gallery-sidebar-link-index">
                                01
                            </span>

                            <span class="gallery-sidebar-link-label">
                                HOME
                            </span>

                            <span
                                class="gallery-sidebar-link-arrow"
                                aria-hidden="true"
                            >
                                ↗
                            </span>
                        </a>

                        <a
                            href="../index.html#work"
                            class="gallery-sidebar-link"
                        >
                            <span class="gallery-sidebar-link-index">
                                02
                            </span>

                            <span class="gallery-sidebar-link-label">
                                WORK
                            </span>

                            <span
                                class="gallery-sidebar-link-arrow"
                                aria-hidden="true"
                            >
                                ↗
                            </span>
                        </a>

                    </nav>

                    <div class="gallery-sidebar-bottom">
                        <span>LYAN / PORTFOLIO</span>
                        <span>ARCHIVE / VIEW</span>
                    </div>

                </div>

            </aside>

            <button
                type="button"
                class="gallery-sidebar-toggle"
                id="gallery-sidebar-toggle"
                aria-label="Open project navigation"
                aria-expanded="false"
            >
                <span class="gallery-sidebar-toggle-arrow">
                    →
                </span>
            </button>

            <header class="project-gallery-header">

                <div class="project-gallery-header-index">

                    <span class="project-gallery-status-dot"></span>

                    <span>
                        SYS / GALLERY_DATABASE
                    </span>

                </div>

                <div class="project-gallery-header-main">

                    <p class="project-gallery-eyebrow">
                        PROJECT ARCHIVE
                    </p>

                    <h1 class="project-gallery-title">
                        GALLERY
                    </h1>

                </div>

                <div class="project-gallery-header-meta">

                    <span>
                        IMAGES
                    </span>

                    <span
                        id="project-gallery-count"
                        class="project-gallery-count"
                    >
                        00
                    </span>

                </div>

            </header>

            <div
                id="project-gallery"
                class="project-gallery-scroll"
                aria-label="Project gallery categories"
            ></div>

            <footer class="project-gallery-footer">

                <span>
                    SCROLL TO EXPLORE
                </span>

                <span
                    class="project-gallery-footer-line"
                    aria-hidden="true"
                ></span>

                <span>
                    END / ARCHIVE
                </span>

            </footer>

        </section>

    </main>

    <script src="../js/project.js"></script>
    <script src="../js/gallery.js"></script>

</body>
</html>
