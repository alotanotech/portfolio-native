<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Project gallery.">
    <title>Project | Lyan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/project-gallery.css">
</head>

<body>

    <div id="navigation"></div>

    <main class="project-page" id="project-page">

        <section
            class="project-gallery"
            id="gallery"
            aria-label="Project gallery"
        >

            <nav class="gallery-home-dock" aria-label="Gallery navigation">
                <a class="gallery-home-dock__link" href="../index.html#hero" aria-label="Back to home" title="Back to home">
                    <img src="https://cdn.jsdelivr.net/npm/@tabler/icons@3.46.0/icons/outline/home.svg" alt="" aria-hidden="true" width="22" height="22">
                </a>
            </nav>

            <header class="project-gallery-header">

                <div class="project-gallery-header-index">

                    <span class="project-gallery-status-dot"></span>

                    <span>PORTFOLIO / <span id="project-gallery-section">WORK</span></span>

                </div>

                <div class="project-gallery-header-main">

                    <p class="project-gallery-eyebrow" id="project-gallery-full-title">PROJECT ARCHIVE</p>

                    <h1 class="project-gallery-title" id="project-gallery-short-title">GALLERY</h1>

                    <p class="project-gallery-client"><span id="project-gallery-client-label">CLIENT</span> / <span id="project-gallery-client"></span></p>

                    <p class="project-gallery-description" id="project-gallery-description"></p>

                </div>

                <div class="project-gallery-header-meta">

                    <span>
                        IMAGES
                    </span>

                    <span
                        id="project-gallery-count"
                        class="project-gallery-count"
                    >
                        00
                    </span>

                </div>

            </header>

            <div
                id="project-gallery"
                class="project-gallery-scroll"
                aria-label="Project gallery categories"
            ></div>

            <footer class="project-gallery-footer">

                <span>
                    SCROLL TO EXPLORE
                </span>

                <span
                    class="project-gallery-footer-line"
                    aria-hidden="true"
                ></span>

                <span>
                    END / ARCHIVE
                </span>

            </footer>

        </section>

    </main>

    <script src="../js/project.js"></script>
    <script src="../js/gallery.js"></script>
    <script src="../js/gallery-reveal.js"></script>

</body>
</html>
